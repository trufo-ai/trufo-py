[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trufo"
version = "1.3.0"
requires-python = ">=3.10"
description = "Trufo SDK for content provenance API services."
readme = "README.md"
license = "Apache-2.0"
keywords = ["trufo", "trufo-py", "C2PA", "content credentials", "content provenance", "CAWG", "watermarking"]
dependencies = [
    "cryptography>=41.0",
    "PyJWT>=2.6",
    "requests>=2.28",
    "uuid-utils>=0.6",
]

[project.optional-dependencies]
# local-sign-only: distributed C2PA signing without the watermark engine
# (no torch); local-full adds trufo-pawprint for local watermark embedding.
# provenance is the legacy alias of local-sign-only.
local-sign-only = ["trufo-provenance[c2pa]>=1.3.0,<1.4.0"]
local-full = ["trufo-provenance[c2pa,pawprint]>=1.3.0,<1.4.0"]
provenance = ["trufo-provenance[c2pa]>=1.3.0,<1.4.0"]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://trufo.ai"
Documentation = "https://trufo.ai/documentation"
Repository = "https://github.com/trufo-ai/trufo-py"

[project.scripts]
trufo = "trufo.intf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
