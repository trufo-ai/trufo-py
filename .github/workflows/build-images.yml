name: build-images

# Build the trufo-local image on a release tag push, check it, push a private
# copy to ECR for vulnerability scanning, then push it to GHCR with its source
# image.
# This workflow does NOT create a GitHub Release (a Release would also run
# publish.yml) and does NOT change the GHCR package's visibility. The checks and
# the source image come before the first push, so a run that fails one of them
# pushes nothing.
#
# Trigger: push a tag  trufo-local-X.Y.Z
#   e.g.  git tag trufo-local-2.1.0   &&  git push origin trufo-local-2.1.0
# On GHCR, X.Y.Z-source is pushed first, then X.Y.Z. X.Y.Z never moves: the run
# fails if GHCR already has it. X.Y moves only when this is the highest
# trufo-local-X.Y.Z tag.

on:
  push:
    tags:
      - "trufo-local-*"

# one release at a time, so X.Y cannot move backwards
concurrency:
  group: trufo-local-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # push to GHCR with GITHUB_TOKEN
  id-token: write   # required to request the OIDC token

jobs:
  build:
    runs-on: ubuntu-latest
    environment: trufo-local
    env:
      IMAGE: ghcr.io/trufo-ai/trufo-local
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and tags from the git tag
        id: release
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^trufo-local-(([0-9]+\.[0-9]+)\.[0-9]+)$ ]]; then
            echo "::error::Expected a tag trufo-local-X.Y.Z, got: $GITHUB_REF_NAME"; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          # X.Y moves only to the highest trufo-local-X.Y.Z tag
          latest=$(git tag -l "trufo-local-$minor.*" | grep -xE 'trufo-local-[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            tags="$version $minor"
            moved="$minor"
          else
            tags="$version"
            moved="none"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "moved=$moved" >> "$GITHUB_OUTPUT"

      - name: Refuse a re-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # the tags of every version of the GHCR package, 100 versions a page; HTTP 404 on the
          # first page means there is no package yet
          versions="$RUNNER_TEMP/versions.json"
          for ((page = 1; ; page++)); do
            status=$(curl -sS -o "$versions" -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/trufo-ai/packages/container/trufo-local/versions?per_page=100&page=$page")
            if [ "$status" = 404 ] && [ "$page" = 1 ]; then break; fi
            if [ "$status" != 200 ]; then
              echo "::error::Listing the package versions answered HTTP $status: $(cat "$versions")"; exit 1
            fi
            tags=$(jq -r '.[].metadata.container.tags[]' "$versions")
            if grep -qxF "$VERSION" <<< "$tags"; then
              echo "::error::$IMAGE:$VERSION already exists."; exit 1
            fi
            if [ "$(jq length "$versions")" -lt 100 ]; then break; fi
          done

      - name: Build image
        id: build
        env:
          TRUFO_PACKAGES_INDEX_KEY: ${{ secrets.TRUFO_PACKAGES_INDEX_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # the index key enters the build as a secret mount only, never as a build arg
          docker build --secret id=TRUFO_PACKAGES_INDEX_KEY --build-arg VERSION="$VERSION" \
            --metadata-file "$RUNNER_TEMP/build.json" -t "$IMAGE:$VERSION" trufo-local
          config_digest=$(jq -er '."containerimage.config.digest"' "$RUNNER_TEMP/build.json")
          echo "config_digest=$config_digest" >> "$GITHUB_OUTPUT"

      - name: Check image
        env:
          TRUFO_SDK_DOWNLOAD_API_KEY: ${{ secrets.TRUFO_PACKAGES_INDEX_KEY }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # folders owned by the user the container runs as, each mounted at its own path
          input_dir="$RUNNER_TEMP/in"
          output_dir="$RUNNER_TEMP/out"
          mkdir "$input_dir" "$output_dir"
          run=(docker run --user "$(id -u):$(id -g)"
            -e TRUFO_LOCAL_INPUT_DIRS="$input_dir" -e TRUFO_LOCAL_OUTPUT_DIRS="$output_dir"
            -v "$input_dir:$input_dir:ro" -v "$output_dir:$output_dir")
          # without a key: exit 1 with the start line
          status=0
          line=$("${run[@]}" --rm "$IMAGE:$VERSION" 2>&1) || status=$?
          if [ "$status" != 1 ] || [ "$line" != "TRUFO_SDK_DOWNLOAD_API_KEY is not set. Set it to your sdk-download key." ]; then
            echo "::error::Start without a key: exit $status: $line"; exit 1
          fi
          # with the key: the engine installs and /health reports this version
          "${run[@]}" -d --name trufo-local-check -p 127.0.0.1:8080:8080 -e TRUFO_SDK_DOWNLOAD_API_KEY "$IMAGE:$VERSION"
          if ! health=$(curl -fsS --retry 60 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/health); then
            docker logs trufo-local-check; exit 1
          fi
          jq -e --arg version "$VERSION" '.version == $version' <<< "$health"
          # in-process check, on the running service
          docker exec -i trufo-local-check python - <<'EOF'
          import importlib.metadata
          import re
          import subprocess
          import sys
          from pathlib import Path

          ffmpeg_library = r"lib(?:av(?:codec|device|filter|format|util)|sw(?:scale|resample)|postproc)"
          problems = []
          # the app's process has loaded the engine and a wheel's bundled FFmpeg, so it holds what a
          # sign would use, and maps none of Debian's FFmpeg, x264 or x265 libraries
          maps = Path("/proc/1/maps").read_text()
          if "/site-packages/tfprov/" not in maps:
              problems.append("pid 1 has not loaded the engine")
          if not re.search(r"/site-packages/[^/]+\.libs/libavcodec-", maps):
              problems.append("pid 1 has not loaded a wheel's bundled FFmpeg")
          debian_library = rf"/usr/lib/x86_64-linux-gnu/(?:{ffmpeg_library}|libx26[45])\.so\S*"
          problems += [
              f"in the app's process: {path}" for path in sorted(set(re.findall(debian_library, maps)))
          ]
          # no AGPL: in the License fields of machine-readable Debian copyright files (in the
          # whole file otherwise), and in each Python distribution's licence metadata
          agpl = re.compile(r"(?i)affero|agpl")
          copyright_files = list(Path("/usr/share/doc").glob("*/copyright"))
          for path in copyright_files:
              text = path.read_text(errors="replace")
              if re.match(r"Format: \S*copyright-format", text):
                  text = "\n".join(re.findall(r"^License:.*", text, re.MULTILINE))
              if agpl.search(text):
                  problems.append(f"AGPL: {path}")
          distributions = list(importlib.metadata.distributions())
          for dist in distributions:
              fields = [dist.metadata.get("License-Expression"), dist.metadata.get("License")]
              fields += dist.metadata.get_all("Classifier", [])
              if agpl.search(" ".join(filter(None, fields))):
                  problems.append(f"AGPL: {dist.name}")
          # nothing nonfree: no Debian package from non-free, and no FFmpeg library (Debian's or one
          # bundled in a wheel) built with FFmpeg's nonfree label
          packages = subprocess.run(
              ["dpkg-query", "-W", "-f", "${Package} ${Section}\n"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()
          problems += [f"non-free: {line}" for line in packages if " non-free" in line]
          ffmpeg_libraries = [
              path for path in Path("/usr").rglob("lib*.so*")
              if not path.is_symlink() and re.match(rf"{ffmpeg_library}[-.]", path.name)
          ]
          problems += [
              f"nonfree: {path}" for path in ffmpeg_libraries
              if b"nonfree and unredistributable" in path.read_bytes()
          ]
          print(
              f"Checked {len(packages)} Debian packages, {len(copyright_files)} copyright files, "
              f"{len(distributions)} Python distributions and {len(ffmpeg_libraries)} FFmpeg libraries."
          )
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          EOF

      - name: Build source image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CONFIG_DIGEST: ${{ steps.build.outputs.config_digest }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/sources"
          mkdir -p "$src/debian" "$src/extra"
          # the source package of every installed Debian package at its installed version, fetched
          # with the image's own apt config; apt checks each file against the signed Sources index
          docker run --rm --entrypoint dpkg-query "$IMAGE:$VERSION" \
            -W -f '${source:Package}=${source:Version}\n' | sort -u > "$src/debian/sources.txt"
          docker run --rm -i --user 0 -v "$src/debian:/out" -w /out --entrypoint sh "$IMAGE:$VERSION" -s <<'EOF'
          set -e
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          xargs -a sources.txt apt-get source --download-only -qq
          EOF
          # every other source is saved under extra/ at its URL's host and path
          cd "$src/extra"
          fetch() { curl -fsSL --create-dirs -o "${1#https://}" "$1"; }
          while read -r sum url; do
            fetch "$url"
            echo "$sum  ${url#https://}" | sha256sum -c -
          done < "$GITHUB_WORKSPACE/trufo-local/extra-sources.txt"
          # CPython's source and the base image's Dockerfile, for the image's Python and Debian release
          python_version=$(docker run --rm --entrypoint python "$IMAGE:$VERSION" -V)
          python_version="${python_version#Python }"
          codename=$(docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '. /etc/os-release && echo "$VERSION_CODENAME"')
          dockerfile_url="https://raw.githubusercontent.com/docker-library/python/master/${python_version%.*}/slim-$codename/Dockerfile"
          dockerfile="${dockerfile_url#https://}"
          fetch "$dockerfile_url"
          if ! grep -qx "ENV PYTHON_VERSION $python_version" "$dockerfile"; then
            echo "::error::$dockerfile_url is not for Python $python_version; rerun once they match."; exit 1
          fi
          python_url="https://www.python.org/ftp/python/$python_version/Python-$python_version.tar.xz"
          fetch "$python_url"
          echo "$(sed -n 's/^ENV PYTHON_SHA256 //p' "$dockerfile")  ${python_url#https://}" | sha256sum -c -
          cd "$src"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          printf 'FROM scratch\nCOPY . /sources/\n' | docker build -f - \
            --label "ai.trufo.trufo-local.image-config=$CONFIG_DIGEST" -t "$IMAGE:$VERSION-source" "$src"

      - name: Configure AWS credentials (OIDC, keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        env:
          ECR_IMAGE: ${{ steps.ecr.outputs.registry }}/trufo-local
          VERSION: ${{ steps.release.outputs.version }}
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          # the same image under the same tags, kept private, for vulnerability scanning; first,
          # so a run that fails here or on GHCR can be rerun
          for tag in $TAGS; do
            docker tag "$IMAGE:$VERSION" "$ECR_IMAGE:$tag"
            docker push "$ECR_IMAGE:$tag"
          done

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push to GHCR
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          set -euo pipefail
          # the source first, so a pushed image always has its source
          docker push "$IMAGE:$VERSION-source"
          for tag in $TAGS; do
            docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Report
        env:
          ECR_IMAGE: ${{ steps.ecr.outputs.registry }}/trufo-local
          VERSION: ${{ steps.release.outputs.version }}
          MOVED: ${{ steps.release.outputs.moved }}
        run: |
          set -euo pipefail
          digest() { docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$1"; }
          image_digest=$(digest "$IMAGE:$VERSION")
          source_digest=$(digest "$IMAGE:$VERSION-source")
          ecr_digest=$(digest "$ECR_IMAGE:$VERSION")
          {
            echo "## Built image"
            echo ""
            echo "- git tag: \`${GITHUB_REF_NAME}\`"
            echo "- \`$IMAGE:$VERSION\`: \`$image_digest\`"
            echo "- \`$IMAGE:$VERSION-source\`: \`$source_digest\`"
            echo "- ECR \`trufo-local:$VERSION\`: \`$ecr_digest\`"
            echo "- moved: $MOVED"
          } >> "$GITHUB_STEP_SUMMARY"
